<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      background: #ffffff;
      color: #1f2328;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      padding: 16px;
    }
    h1 {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1 .icon {
      width: 20px;
      height: 20px;
      border-radius: 4px;
    }
    /* Card tabs: margin-bottom -1px makes the tab bottom border overlap the
       settings card's top border so the two read as one card. The active tab
       is a solid green block with white text; inactive tabs recede on gray. */
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: -1px;
      position: relative;
      z-index: 1;
    }
    .tab {
      position: relative;
      flex: 1;
      padding: 8px 0 7px;
      background: #eef1f4;
      border: 1px solid #eaeef2;
      border-radius: 8px 8px 0 0;
      font-size: 12px;
      font-weight: 600;
      color: #6e7781;
      cursor: pointer;
      text-align: center;
      transition: background .15s ease, color .15s ease;
    }
    .tab:hover:not(.active) {
      background: #e8ecef;
      color: #57606a;
    }
    .tab.active {
      background: #22c55e;
      border-color: #22c55e;
      color: #ffffff;
      font-weight: 700;
    }
    .tab-panel.hidden { display: none; }
    .settings-group {
      margin-bottom: 12px;
      padding: 0 12px;
      background: #f6f8fa;
      border: 1px solid #eaeef2;
      border-radius: 8px;
    }
    .section {
      padding: 10px 0;
    }
    .section + .section {
      border-top: 1px solid #eaeef2;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .label {
      font-size: 13px;
      color: #1f2328;
      font-weight: 500;
    }
    /* Toggle switch */
    .switch {
      position: relative;
      width: 40px;
      height: 22px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #d0d5dd;
      border-radius: 22px;
      transition: .2s;
    }
    .slider:before {
      content: "";
      position: absolute;
      height: 16px; width: 16px;
      left: 3px; bottom: 3px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(31, 35, 40, 0.2);
      transition: .2s;
    }
    input:checked + .slider { background: #22c55e; }
    input:checked + .slider:before { transform: translateX(18px); }

    /* Shortcut input */
    .shortcut-input {
      width: 120px;
      padding: 4px 8px;
      background: #ffffff;
      border: 1px solid #d0d5dd;
      border-radius: 4px;
      color: #1f2328;
      font-size: 12px;
      text-align: center;
      cursor: pointer;
      outline: none;
    }
    .shortcut-input:focus {
      border-color: #22c55e;
    }
    /* Filter number input */
    .filter-input {
      width: 100px;
      padding: 4px 8px;
      background: #ffffff;
      border: 1px solid #d0d5dd;
      border-radius: 4px;
      color: #1f2328;
      font-size: 12px;
      text-align: right;
      outline: none;
    }
    .filter-input:focus {
      border-color: #22c55e;
    }
    /* Checkbox row for multi-select filters */
    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      align-items: center;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #1f2328;
      cursor: pointer;
    }
    .checkbox-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #22c55e;
    }
    .status {
      font-size: 11px;
      color: #6e7781;
      text-align: center;
      margin-top: 8px;
    }
    .status.ok { color: #1a7f37; }
  </style>
</head>
<body>
  <h1>
    <img class="icon" src="icons/icon128.png" alt="">
    TrenchMate
  </h1>

  <div class="tabs">
    <button class="tab active" data-tab="gmgn" type="button">GMGN</button>
    <button class="tab" data-tab="fomo" type="button">FOMO</button>
  </div>

  <div class="tab-panel" data-panel="gmgn">
    <div class="settings-group">
      <div class="section" title="子页面自动展开推特预览弹窗">
        <div class="row">
          <span class="label">推特预览</span>
          <label class="switch">
            <input type="checkbox" id="tweetPreviewToggle" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="section" title="在 GMGN 代币页显示 fomo/pump 数据悬浮窗，可拖动定位">
        <div class="row">
          <span class="label">fomo/pump数据窗体</span>
          <label class="switch">
            <input type="checkbox" id="countBoxToggle" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="section" title="按快捷键在相邻标签页后台打开当前代币的社媒（X）帖子">
        <div class="row">
          <span class="label">打开社媒</span>
          <label class="switch">
            <input type="checkbox" id="openSocialToggle" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="section" title="隐藏当前代币并返回上一页">
        <div class="row">
          <span class="label">隐藏代币</span>
          <input type="text" class="shortcut-input" data-key="hideShortcut" readonly value="Alt+W">
        </div>
      </div>

      <div class="section" title="返回战壕列表页">
        <div class="row">
          <span class="label">返回战壕</span>
          <input type="text" class="shortcut-input" data-key="trenchesShortcut" readonly value="Alt+Q">
        </div>
      </div>

      <div class="section" title="跳转至热门趋势页">
        <div class="row">
          <span class="label">跳转热门</span>
          <input type="text" class="shortcut-input" data-key="trendingShortcut" readonly value="Alt+E">
        </div>
      </div>

      <div class="section" title="跳转至监控页">
        <div class="row">
          <span class="label">跳转监控</span>
          <input type="text" class="shortcut-input" data-key="monitorShortcut" readonly value="Alt+R">
        </div>
      </div>

      <div class="section" title="GMGN 与 FOMO 单币页互相跳转">
        <div class="row">
          <span class="label">GMGN / FOMO 互跳</span>
          <input type="text" class="shortcut-input" data-key="openFomoShortcut" readonly value="Alt+T">
        </div>
      </div>

      <div class="section" title="点击页面上的 X 搜索图标，在 X 上搜索当前代币地址">
        <div class="row">
          <span class="label">X 搜索</span>
          <input type="text" class="shortcut-input" data-key="xSearchShortcut" readonly value="Alt+5">
        </div>
      </div>

      <div class="section" title="在相邻标签页后台打开当前代币的社媒（X）帖子">
        <div class="row">
          <span class="label">打开社媒</span>
          <input type="text" class="shortcut-input" data-key="openSocialShortcut" readonly value="Alt+4">
        </div>
      </div>

      <div class="section" title="打开区块链浏览器，优先检索发行人地址，若无则打开代币地址">
        <div class="row">
          <span class="label">区块浏览器</span>
          <input type="text" class="shortcut-input" data-key="explorerShortcut" readonly value="Alt+G">
        </div>
      </div>
    </div>
  </div>

  <div class="tab-panel hidden" data-panel="fomo">
    <div class="settings-group">
      <div class="section" title="将左侧 Alert 面板改为 GMGN 紧凑表格样式">
        <div class="row">
          <span class="label">GMGN 风格 Alert</span>
          <label class="switch">
            <input type="checkbox" id="gmgnStyleToggle">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="section" title="隐藏 Alert 中的 Thesis 内容，合并到紧凑行">
        <div class="row">
          <span class="label">隐藏 Thesis</span>
          <label class="switch">
            <input type="checkbox" id="hideThesisToggle">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="section" title="左侧 Alert 面板中显示的交易类型">
        <div class="row">
          <span class="label">Alert 显示</span>
          <div class="checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" data-alert-filter="buy" checked>
              <span>buy</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" data-alert-filter="sell" checked>
              <span>sell</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" data-alert-filter="thesis" checked>
              <span>Thesis</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" data-alert-filter="isup" checked>
              <span>Is Up</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" data-alert-filter="closed" checked>
              <span>Closed</span>
            </label>
          </div>
        </div>
      </div>
    </div>

    <div class="settings-group">
      <div class="section" title="自动显示持仓钱包的关注、粉丝、资产与 7 日盈亏">
        <div class="row">
          <span class="label">FOMO 钱包预览</span>
          <label class="switch">
            <input type="checkbox" id="walletPreviewToggle" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="section" title="粉丝数大于该值才预览，0 为不限制">
        <div class="row">
          <span class="label">粉丝数下限</span>
          <input type="number" class="filter-input" data-key="fomoMinFollowers" min="0" step="any" placeholder="0">
        </div>
      </div>

      <div class="section" title="该币持仓代币数量大于该值才预览，0 为不限制">
        <div class="row">
          <span class="label">持仓数量下限</span>
          <input type="number" class="filter-input" data-key="fomoMinTokenAmount" min="0" step="any" placeholder="0">
        </div>
      </div>

      <div class="section" title="总资产（美元）大于该值才预览，0 为不限制">
        <div class="row">
          <span class="label">总资产下限</span>
          <input type="number" class="filter-input" data-key="fomoMinPortfolio" min="0" step="any" placeholder="0">
        </div>
      </div>

      <div class="section" title="仅预览列表前 X 个用户，0 为不限制">
        <div class="row">
          <span class="label">预览用户上限</span>
          <input type="number" class="filter-input" data-key="fomoMaxUsers" min="0" step="1" placeholder="0">
        </div>
      </div>
    </div>
  </div>

  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
